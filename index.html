<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026 청소년과학탐구대회 · EIDOS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="home">
    <main class="wrap">
      <p class="kicker">2026 청소년과학탐구대회 · EIDOS</p>
      <h1>AI는 문제를 몇 개 봐야,<br />얼마나 지나서 깨닫는가</h1>
      <p class="title">
        수열 변환 규칙을 학습하는 Transformer에서 grokking의 경계와 지연을
        정하는 요인
      </p>
      <ul class="menu">
        <li>
          <a href="try/">
            <span class="name">체험하기</span>
            <span class="desc">AI가 규칙을 깨닫는 과정을 직접 해 보기</span>
          </a>
        </li>
        <li>
          <a href="report/">
            <span class="name">보고서</span>
            <span class="desc">연구 질문, 실험 방법, 결과와 결론</span>
          </a>
        </li>
        <li>
          <a href="https://anonymous.4open.science/r/Grokking-6E17">
            <span class="name">소스코드 <span class="ext">↗</span></span>
            <span class="desc">실험 코드, 원자료, 그림 생성 코드</span>
          </a>
        </li>
      </ul>
    </main>
    <script>
      // L 키: 전시용 반복 화면을 전체 화면으로 띄운다 (Esc로 닫기)
      (() => {
        let fr = null;
        const close = () => {
          if (!fr) return;
          fr.remove();
          fr = null;
          if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        };
        addEventListener("keydown", (e) => {
          if (e.code !== "KeyL" || fr || e.ctrlKey || e.metaKey || e.altKey) return;
          fr = document.createElement("iframe");
          fr.src = "loop/";
          fr.allow = "screen-wake-lock; fullscreen";
          fr.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99;background:#fff";
          document.body.appendChild(fr);
          fr.addEventListener("load", () => fr && fr.focus());
          document.documentElement.requestFullscreen?.().catch(() => {});
        });
        addEventListener("message", (e) => e.data === "loop-exit" && close());
        // 초점이 바깥 페이지에 있어도 ← → 로 장면 이동
        addEventListener("keydown", (e) => {
          if (!fr || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
          e.preventDefault();
          fr.contentWindow?.postMessage(e.key === "ArrowRight" ? "loop-next" : "loop-prev", "*");
        });
        document.addEventListener("fullscreenchange", () => !document.fullscreenElement && close());
      })();
    </script>
  </body>
</html>
