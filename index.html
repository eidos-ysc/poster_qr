<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI가 깨닫는 순간</title>
  <meta name="description" content="수열 변환 규칙을 학습하는 Transformer에서 grokking의 경계와 지연을 정하는 요인">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #EEF1EC;      /* 모눈종이처럼 옅은 회녹색 바탕 */
      --grid: #DCE2DA;       /* 그래프 눈금 */
      --ink: #1C2530;        /* 글자 */
      --muted: #5B6672;      /* 보조 글자 */
      --memo: #D9961A;       /* 암기 곡선: 학습한 문제 */
      --gen: #2357C6;        /* 일반화 곡선: 처음 보는 문제, 강조색 */
      --card: #FFFFFF;
      --on-gen: #FFFFFF;
      --line: #CDD4CB;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #141A20; --grid: #222B33; --ink: #E6EAEE; --muted: #9AA5B0;
        --memo: #E8A93A; --gen: #6C9BFF; --card: #1B232B; --line: #2C3742; --on-gen: #0E1620;
      }
    }
    :root[data-theme="dark"] {
      --paper: #141A20; --grid: #222B33; --ink: #E6EAEE; --muted: #9AA5B0;
      --memo: #E8A93A; --gen: #6C9BFF; --card: #1B232B; --line: #2C3742; --on-gen: #0E1620;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      word-break: keep-all;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; }

    /* 머리말 */
    header { padding: 36px 0 8px; }
    .question {
      font-size: clamp(1.75rem, 7vw, 2.4rem);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    .title {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    /* 대표 그림: grokking 곡선 */
    figure.curve { margin: 20px 0 8px; }
    figure.curve svg { display: block; width: 100%; height: auto; overflow: visible; }
    .gridline { stroke: var(--grid); stroke-width: 1; }
    .axis { stroke: var(--muted); stroke-width: 1; }
    .axis-label { fill: var(--muted); font-size: 11px; }
    .series { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .series.memo { stroke: var(--memo); }
    .series.gen { stroke: var(--gen); }
    .tag { font-size: 12px; font-weight: 500; }
    .tag.memo { fill: var(--memo); }
    .tag.gen { fill: var(--gen); }
    .gap { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
    .gap-label { fill: var(--muted); font-size: 11px; }
    .moment { fill: var(--gen); }
    figcaption { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

    /* 한 번만 그려지는 곡선 */
    @media (prefers-reduced-motion: no-preference) {
      .series { stroke-dasharray: 1; stroke-dashoffset: 1; }
      .series.memo { animation: draw 0.9s ease-out 0.2s forwards; }
      .series.gen { animation: draw 2.2s cubic-bezier(.7,0,.2,1) 0.5s forwards; }
      .late { opacity: 0; animation: show 0.4s ease-out 2.5s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes show { to { opacity: 1; } }
    }

    /* 탭 */
    .tabs-bar {
      position: sticky; top: 0; z-index: 5;
      background: var(--paper);
      padding: 10px 0;
      margin-top: 16px;
      border-bottom: 1px solid var(--line);
    }
    [role="tablist"] { display: flex; gap: 6px; }
    [role="tab"] {
      flex: 1;
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 10px 8px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 44px;
    }
    [role="tab"][aria-selected="true"] {
      background: var(--gen);
      border-color: var(--gen);
      color: var(--on-gen);
    }
    [role="tab"]:focus-visible { outline: 3px solid var(--memo); outline-offset: 2px; }

    /* 탭 내용 */
    [role="tabpanel"] { padding: 28px 0 48px; }
    [role="tabpanel"]:focus-visible { outline: none; }
    .panel-title { font-size: 1.3rem; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.01em; }
    .panel-lead { color: var(--muted); margin: 0 0 20px; }
    .slot {
      border: 1.5px dashed var(--line);
      border-radius: 14px;
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      background: color-mix(in srgb, var(--card) 55%, transparent);
    }

    footer { border-top: 1px solid var(--line); padding: 20px 0 40px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1 class="question">AI는 문제를 몇 개 봐야,<br>얼마나 지나서 깨닫는가</h1>
      <p class="title">수열 변환 규칙을 학습하는 Transformer에서 grokking의 경계와 지연을 정하는 요인</p>

      <figure class="curve" aria-labelledby="curve-cap">
        <svg viewBox="0 0 360 200" role="img" aria-label="학습한 문제의 정답률은 금방 100%가 되지만, 처음 보는 문제의 정답률은 한참 0%에 머물다가 어느 순간 갑자기 100%로 오른다.">
          <!-- 눈금 -->
          <line class="gridline" x1="30" y1="20"  x2="350" y2="20"/>
          <line class="gridline" x1="30" y1="65"  x2="350" y2="65"/>
          <line class="gridline" x1="30" y1="110" x2="350" y2="110"/>
          <line class="gridline" x1="30" y1="155" x2="350" y2="155"/>
          <line class="axis" x1="30" y1="160" x2="350" y2="160"/>
          <text class="axis-label" x="24" y="24" text-anchor="end">100%</text>
          <text class="axis-label" x="24" y="164" text-anchor="end">0%</text>
          <text class="axis-label" x="350" y="178" text-anchor="end">학습 시간 →</text>

          <!-- 학습한 문제: 금방 외운다 -->
          <path class="series memo" pathLength="1"
                d="M30 158 C 44 150, 50 30, 66 21 L 350 20"/>
          <!-- 처음 보는 문제: 한참 0%에 있다가 갑자기 오른다 -->
          <path class="series gen" pathLength="1"
                d="M30 158 L 228 156 C 244 154, 252 30, 272 21 L 350 20"/>

          <g class="late">
            <line class="gap" x1="66" y1="120" x2="226" y2="120"/>
            <text class="gap-label" x="146" y="114" text-anchor="middle">외우기만 하는 시간</text>
            <circle class="moment" cx="251" cy="90" r="4"/>
            <text class="tag gen" x="258" y="94">깨닫는 순간</text>
            <text class="tag memo" x="70" y="40">학습한 문제</text>
            <text class="tag gen" x="72" y="150">처음 보는 문제</text>
          </g>
        </svg>
        <figcaption id="curve-cap">AI가 연습 문제를 다 외운 뒤에도 한참 동안 새 문제는 못 풀다가, 어느 순간 규칙을 깨닫습니다. 이 현상을 grokking이라고 합니다.</figcaption>
      </figure>
    </header>
  </div>

  <nav class="tabs-bar" aria-label="자료">
    <div class="wrap">
      <div role="tablist" aria-label="자료 종류">
        <button role="tab" id="tab-try" aria-controls="try" aria-selected="true">체험하기</button>
        <button role="tab" id="tab-report" aria-controls="report" aria-selected="false" tabindex="-1">보고서</button>
        <button role="tab" id="tab-code" aria-controls="code" aria-selected="false" tabindex="-1">소스코드</button>
      </div>
    </div>
  </nav>

  <main class="wrap">
    <section role="tabpanel" id="try" aria-labelledby="tab-try" tabindex="0">
      <h2 class="panel-title">직접 체험하기</h2>
      <p class="panel-lead">AI에게 보여줄 문제 수를 바꿔 보며, 언제 규칙을 깨닫는지 확인해 보세요.</p>
      <div class="slot">체험 화면을 준비하고 있습니다.</div>
    </section>

    <section role="tabpanel" id="report" aria-labelledby="tab-report" tabindex="0" hidden>
      <h2 class="panel-title">보고서</h2>
      <p class="panel-lead">연구 질문, 실험 방법, 결과와 결론을 정리한 최종 보고서입니다.</p>
      <div class="slot">보고서를 준비하고 있습니다.</div>
    </section>

    <section role="tabpanel" id="code" aria-labelledby="tab-code" tabindex="0" hidden>
      <h2 class="panel-title">소스코드</h2>
      <p class="panel-lead">실험에 쓴 모델, 학습, 분석 코드입니다.</p>
      <div class="slot">소스코드를 준비하고 있습니다.</div>
    </section>
  </main>

  <footer>
    <div class="wrap">2026 청소년과학탐구대회 출품작</div>
  </footer>

  <script>
    (function () {
      var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
      function select(tab, focus) {
        tabs.forEach(function (t) {
          var on = t === tab;
          t.setAttribute('aria-selected', on ? 'true' : 'false');
          t.tabIndex = on ? 0 : -1;
          document.getElementById(t.getAttribute('aria-controls')).hidden = !on;
        });
        if (focus) tab.focus();
        var id = tab.getAttribute('aria-controls');
        if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
      }
      tabs.forEach(function (t, i) {
        t.addEventListener('click', function () { select(t, false); });
        t.addEventListener('keydown', function (e) {
          var n = null;
          if (e.key === 'ArrowRight') n = tabs[(i + 1) % tabs.length];
          if (e.key === 'ArrowLeft') n = tabs[(i - 1 + tabs.length) % tabs.length];
          if (e.key === 'Home') n = tabs[0];
          if (e.key === 'End') n = tabs[tabs.length - 1];
          if (n) { e.preventDefault(); select(n, true); }
        });
      });
      var start = tabs.filter(function (t) { return '#' + t.getAttribute('aria-controls') === location.hash; })[0];
      if (start) select(start, false);
    })();
  </script>
</body>
</html>
