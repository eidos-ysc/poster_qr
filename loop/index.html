<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 브라우저 강제 다크 모드(크롬 자동 어둡게, 삼성 인터넷 등)가 색을 뒤집지 않게 -->
    <meta name="color-scheme" content="only light" />
    <title>전시 화면</title>
    <style>
      :root {
        color-scheme: only light;
        --bg: #ffffff;
        --ink: #111111;
        --muted: #6e6e6e;
        --line: #dcdcdc;
        --grid: #ececec;
        --train: #eb6834;
        --test: #2a78d6;
        --fix: #2f9461;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
        cursor: none;
        font-family: Pretendard, -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        word-break: keep-all;
      }
      #stage {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1600px;
        height: 900px;
        transform-origin: 50% 50%;
      }
      .head {
        position: absolute;
        left: 120px;
        right: 240px;
        top: 64px;
        transition: opacity 0.35s;
      }
      .cap {
        position: absolute;
        left: 120px;
        right: 120px;
        bottom: 64px;
        text-align: center;
        font-size: 30px;
        line-height: 1.4;
        color: var(--ink);
        transition: opacity 0.25s;
      }
      .cap.off {
        opacity: 0;
      }
      .head.off {
        opacity: 0;
      }
      .kick {
        font-size: 26px;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .title {
        font-size: 52px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .sub {
        font-size: 28px;
        color: var(--muted);
        margin: 14px 0 0;
        line-height: 1.4;
      }
      .sub b {
        color: var(--ink);
      }
      svg#g {
        position: absolute;
        inset: 0;
        width: 1600px;
        height: 900px;
        transition: opacity 0.5s;
      }
      svg#g.off {
        opacity: 0;
      }
      svg text {
        font-family: inherit;
      }
      .dots {
        position: absolute;
        bottom: 26px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .dots i {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--line);
        transition: background 0.3s;
      }
      .dots i.on {
        background: var(--ink);
      }
      .qr {
        position: absolute;
        right: 40px;
        top: 14px;
        width: 150px;
        text-align: center;
      }
      .qr svg {
        display: block;
        width: 150px;
        height: 150px;
        border: 2px solid var(--line);
        border-radius: 8px;
      }
      .qr b {
        display: block;
        margin-top: 8px;
        font-size: 19px;
      }
      .qr span {
        display: block;
        font-size: 15px;
        color: var(--test);
        font-weight: 600;
      }
      .brand {
        position: absolute;
        right: 40px;
        bottom: 6px;
        font-size: 20px;
        color: var(--muted);
      }
      .start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 22px;
        color: var(--muted);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="head" id="head">
        <p class="kick" id="kick"></p>
        <h1 class="title" id="title"></h1>
        <p class="sub" id="sub"></p>
      </div>
      <svg id="g" viewBox="0 0 1600 900" aria-hidden="true"></svg>
      <div class="cap" id="cap"></div>
      <div class="dots" id="dots"></div>
      <div class="qr" id="qr"></div>
      <div class="brand">2026 청소년과학탐구대회 | EIDOS</div>
    </div>

    <script>
      (() => {
        const $ = (s) => document.querySelector(s);
        const NS = "http://www.w3.org/2000/svg";
        const G = $("#g");
        const fmt = (x) => Math.round(x).toLocaleString("ko-KR");
        // 점검용: ?s=장면번호&speed=배속&stop=1 (그 장면에서 멈춤)
        const Q = new URLSearchParams(location.search);
        const SPEED = +Q.get("speed") || 1;
        const sleep = (ms) => new Promise((r) => setTimeout(r, ms / SPEED));
        const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
        // 그래프가 그려지는 속도 (1 = 원래 속도, 작을수록 빠름)
        const DRAW = 0.5;
        function tween(ms, fn) {
          ms = (ms * DRAW) / SPEED;
          if (ms < 20) {
            fn(1);
            return Promise.resolve();
          }
          return new Promise((res) => {
            const t0 = performance.now();
            const tick = (now) => {
              const u = Math.min(1, (now - t0) / ms);
              fn(u);
              if (u < 1) requestAnimationFrame(tick);
              else res();
            };
            requestAnimationFrame(tick);
          });
        }
        function el(tag, attrs, parent, text) {
          const e = document.createElementNS(NS, tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          if (text != null) e.textContent = text;
          (parent || G).appendChild(e);
          return e;
        }
        const stepLabel = (v) =>
          v >= 10000 ? v / 10000 + "만" : v >= 1000 ? v / 1000 + "천" : String(v);

        /* ---------- 화면 맞춤 (1600×900을 창에 맞게) ---------- */
        function fit() {
          const s = Math.min(innerWidth / 1600, innerHeight / 900);
          $("#stage").style.transform = `translate(-50%, -50%) scale(${s})`;
        }
        addEventListener("resize", fit);
        fit();

        /* ---------- 머리말 ---------- */
        async function head(kick, title, sub) {
          const h = $("#head");
          h.classList.add("off");
          await sleep(350);
          if (SPEED > 1) h.style.transition = "none";
          $("#kick").textContent = kick || "";
          $("#title").innerHTML = title || "";
          $("#sub").innerHTML = sub || "";
          h.classList.remove("off");
        }
        async function clear() {
          G.classList.add("off");
          $("#head").classList.add("off");
          $("#cap").classList.add("off");
          await sleep(550);
          G.innerHTML = "";
          $("#cap").innerHTML = "";
          G.classList.remove("off");
        }

        /* ---------- 공통 축 (로그 x) ---------- */
        function axes(box, xr, xticks, yfmt, ylog, yr, yticks) {
          const lx = (v) => box.x + ((Math.log(v) - Math.log(xr[0])) / (Math.log(xr[1]) - Math.log(xr[0]))) * box.w;
          const ly = ylog
            ? (v) => box.y + (1 - (Math.log(v) - Math.log(yr[0])) / (Math.log(yr[1]) - Math.log(yr[0]))) * box.h
            : (v) => box.y + (1 - (v - yr[0]) / (yr[1] - yr[0])) * box.h;
          for (const v of yticks) {
            el("line", { x1: box.x, x2: box.x + box.w, y1: ly(v), y2: ly(v), stroke: "var(--grid)", "stroke-width": 2 });
            el("text", { x: box.x - 14, y: ly(v) + 7, "text-anchor": "end", "font-size": 20, fill: "var(--muted)" }, null, yfmt(v));
          }
          for (const [v, lab] of xticks)
            el("text", { x: lx(v), y: box.y + box.h + 36, "text-anchor": "middle", "font-size": 20, fill: "var(--muted)" }, null, lab);
          return { lx, ly };
        }
        // 점들을 단조 3차 곡선으로 잇는다 (기록값 사이를 넘쳐 나가지 않음)
        function mono(P) {
          const n = P.length;
          if (n < 2) return n ? `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}` : "";
          const m = [], tg = [];
          for (let i = 0; i < n - 1; i++) m.push((P[i + 1][1] - P[i][1]) / (P[i + 1][0] - P[i][0]));
          tg[0] = m[0];
          tg[n - 1] = m[n - 2];
          for (let i = 1; i < n - 1; i++) tg[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
          for (let i = 0; i < n - 1; i++) {
            if (m[i] === 0) { tg[i] = tg[i + 1] = 0; continue; }
            const a = tg[i] / m[i], b = tg[i + 1] / m[i], q = a * a + b * b;
            if (q > 9) { const k = 3 / Math.sqrt(q); tg[i] = k * a * m[i]; tg[i + 1] = k * b * m[i]; }
          }
          let d = `M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
          for (let i = 0; i < n - 1; i++) {
            const dx = (P[i + 1][0] - P[i][0]) / 3;
            d += `C${(P[i][0] + dx).toFixed(1)},${(P[i][1] + tg[i] * dx).toFixed(1)} ${(P[i + 1][0] - dx).toFixed(1)},${(P[i + 1][1] - tg[i + 1] * dx).toFixed(1)} ${P[i + 1][0].toFixed(1)},${P[i + 1][1].toFixed(1)}`;
          }
          return d;
        }
        // step t까지의 곡선. 다음 기록점까지는 로그 step으로 이어 그려서 끊기지 않게 한다.
        // ext: 기록이 끝난 뒤(일반화 후 학습 종료)를 마지막 값으로 ext step까지 이어 그림
        function curve(xs, ys, t, lx, ly, ext) {
          const P = [];
          let i = 0;
          for (; i < xs.length && xs[i] <= t; i++) P.push([lx(xs[i]), ly(ys[i])]);
          if (i && i < xs.length) {
            const u = (Math.log(t) - Math.log(xs[i - 1])) / (Math.log(xs[i]) - Math.log(xs[i - 1]));
            const x = lx(t);
            if (x - P[P.length - 1][0] > 0.5) P.push([x, ly(ys[i - 1] + u * (ys[i] - ys[i - 1]))]);
          } else if (i && i === xs.length && ext && t > xs[i - 1]) {
            const x = lx(Math.min(t, ext));
            if (x - P[P.length - 1][0] > 0.5) P.push([x, ly(ys[i - 1])]);
          }
          return mono(P);
        }
        const lineStyle = (col, dash) => ({
          fill: "none", stroke: col, "stroke-width": 5, "stroke-linejoin": "round", "stroke-linecap": "round",
          ...(dash ? { "stroke-dasharray": "12 9" } : {}),
        });
        function vmark(x, y0, y1, label) {
          el("line", { x1: x, x2: x, y1: y0 - 6, y2: y1, stroke: "var(--muted)", "stroke-width": 2, "stroke-dasharray": "6 6" });
          if (label) el("text", { x, y: y0 - 16, "text-anchor": "middle", "font-size": 24, "font-weight": 700, fill: "var(--ink)" }, null, label);
        }
        function legend(items, x, y) {
          for (const [col, lab, dash] of items) {
            el("line", { x1: x, x2: x + 36, y1: y, y2: y, ...lineStyle(col, dash) });
            const t = el("text", { x: x + 48, y: y + 8, "font-size": 22, fill: "var(--muted)" }, null, lab);
            x += 48 + t.getComputedTextLength() + 40;
          }
        }

        /* ---------- 데이터 ---------- */
        let B = null, Nz = null;
        const runsOf = (N) => B.conds["add|50|1"].N[N];
        const stepsOf = (r) => B.steps.slice(0, r.te.length - 1).concat([r.last]);
        const rule = (s) => s.map((a, i) => ((a + s[(i + 1) % s.length]) % 50) + 1);

        /* ---------- 자막 ---------- */
        // 글자 수에 맞춰 읽을 시간을 준다 (전시장 관람객 기준으로 넉넉하게)
        const readMs = (h) => Math.max(2800, h.replace(/<[^>]+>/g, "").length * 130);
        async function say(h, wait = true) {
          const c = $("#cap");
          c.classList.add("off");
          await sleep(250);
          c.innerHTML = h || "";
          c.classList.remove("off");
          if (wait) await sleep(readMs(h || ""));
        }
        function axTitle(box, xt, yt, note) {
          if (xt) el("text", { x: box.x + box.w / 2, y: box.y + box.h + 74, "text-anchor": "middle", "font-size": 22, fill: "var(--ink)" }, null, xt);
          if (yt) el("text", { x: 0, y: 0, transform: `translate(${box.x - 86},${box.y + box.h / 2}) rotate(-90)`, "text-anchor": "middle", "font-size": 22, fill: "var(--ink)" }, null, yt);
          if (note) el("text", { x: box.x + box.w, y: box.y + box.h + 74, "text-anchor": "end", "font-size": 18, fill: "var(--muted)" }, null, note);
        }
        const LOGNOTE = "로그 눈금 (한 칸에 10배)";
        const SCALENOTE = "로그 눈금";

        /* ---------- 장면 ---------- */
        async function sTitle() {
          await head(
            "2026 청소년과학탐구대회",
            "외우기만 하던 AI가<br>어느 순간 규칙을 깨우칩니다",
            "이 현상을 <b>Grokking</b>이라고 합니다. 그래프는 실제 학습 기록을 사용했습니다."
          );
          // 장식: 실제 학습 곡선 한 줄이 천천히 그려진다
          const r = runsOf("665")[1], ST = stepsOf(r);
          const box = { x: 120, y: 500, w: 1360, h: 270 };
          const lx = (v) => box.x + ((Math.log(v) - Math.log(100)) / (Math.log(r.last) - Math.log(100))) * box.w;
          const ly = (v) => box.y + (1 - v / 100) * box.h;
          const pTr = el("path", { ...lineStyle("var(--train)"), opacity: 0.55 });
          const pTe = el("path", lineStyle("var(--test)"));
          await tween(5000, (u) => {
            const t = u === 1 ? r.last : Math.exp(Math.log(100) + ease(u) * (Math.log(r.last) - Math.log(100)));
            pTr.setAttribute("d", curve(ST, r.tr, t, lx, ly));
            pTe.setAttribute("d", curve(ST, r.te, t, lx, ly));
          });
          await sleep(4500);
        }

        // AI가 풀어야 하는 규칙을 예시 하나로 차근차근 보여 준다
        async function sRule() {
          await head("AI가 푼 문제", "위 수열을 넣으면 아래 수열이 나옵니다", "");
          const IN = [3, 17, 8, 42, 25], OUT = rule(IN);
          const w = 130, gap = 40, x0 = (1600 - (5 * w + 4 * gap)) / 2, h = 110, yi = 290, yo = 590;
          const cx = (i) => x0 + i * (w + gap) + w / 2;
          el("text", { x: x0 - 34, y: yi + h / 2 + 10, "text-anchor": "end", "font-size": 26, fill: "var(--muted)" }, null, "입력");
          el("text", { x: x0 - 34, y: yo + h / 2 + 10, "text-anchor": "end", "font-size": 26, fill: "var(--muted)" }, null, "출력");
          const ib = IN.map((v, i) => {
            const r = el("rect", { x: cx(i) - w / 2, y: yi, width: w, height: h, rx: 14, fill: "#f1f1f1", stroke: "var(--bg)", "stroke-width": 4 });
            el("text", { x: cx(i), y: yi + h / 2 + 17, "text-anchor": "middle", "font-size": 48, "font-weight": 700 }, null, v);
            return r;
          });
          const ob = OUT.map((v, i) => {
            const r = el("rect", { x: cx(i) - w / 2, y: yo, width: w, height: h, rx: 14, fill: "#fbe3d6", stroke: "var(--bg)", "stroke-width": 4 });
            el("text", { x: cx(i), y: yo + h / 2 + 17, "text-anchor": "middle", "font-size": 48, "font-weight": 700, fill: "var(--train)" }, null, v);
            return r;
          });
          await say("어떤 규칙인지 먼저 찾아보세요");
          await sleep(5000);
          const mid = yi + h + (yo - yi - h) / 2;
          let g = null;
          for (let i = 0; i < 5; i++) {
            const j = (i + 1) % 5, a = IN[i], b = IN[j];
            ib.forEach((r, k) => r.setAttribute("fill", k === i || k === j ? "#d6e6f8" : "#f1f1f1"));
            ob.forEach((r, k) => r.setAttribute("stroke", k === i ? "var(--train)" : "var(--bg)"));
            if (g) g.remove();
            g = el("g", {});
            for (const k of [i, j])
              el("line", { x1: cx(k), y1: yi + h + 6, x2: cx(i), y2: yo - 6, stroke: "var(--test)", "stroke-width": 3, opacity: 0.5 }, g);
            const t = el("text", { x: cx(i) + (i === 4 ? -20 : 90), y: mid + 12, "text-anchor": i === 4 ? "end" : "start", "font-size": 32, "font-weight": 700, fill: "var(--ink)" }, g);
            t.innerHTML = `${a} + ${b} = ${a + b}  <tspan fill="var(--muted)">→</tspan>  <tspan fill="var(--train)">${OUT[i]}</tspan>`;
            el("rect", { x: t.getBBox().x - 14, y: mid - 26, width: t.getBBox().width + 28, height: 52, rx: 10, fill: "var(--bg)" }, g).after(t);
            if (i === 0) await say("이웃한 두 수를 더해 50으로 나눈 나머지에 1을 더합니다");
            else if (i === 4) {
              say("마지막 수는 첫 수와 계산합니다", false);
              await sleep(2200);
            } else await sleep(1100);
          }
          g.remove();
          ib.forEach((r) => r.setAttribute("fill", "#f1f1f1"));
          ob.forEach((r) => r.setAttribute("stroke", "var(--bg)"));
          el("rect", { x: x0, y: mid - 34, width: 5 * w + 4 * gap, height: 68, rx: 12, fill: "#1f2f5c" });
          el("text", { x: 800, y: mid + 11, "text-anchor": "middle", "font-size": 30, "font-weight": 700, fill: "#fff" }, null, "AI (작은 Transformer)");
          await head("AI가 푼 문제", "AI에게 규칙은 알려 주지 않았습니다", "");
          await say("문제와 정답만 보여 주고, 규칙은 스스로 찾게 했습니다");
        }

        // 공부용 문제와 시험 문제를 나누는 이유
        async function sSetup() {
          await head("학습 문제와 평가 문제", "외운 것과 이해한 것을 구분하는 법", "");
          const SEQ = [[12, 40, 7, 33, 9], [48, 2, 19, 26, 31], [5, 44, 38, 11, 20], [27, 13, 50, 6, 35], [1, 29, 46, 22, 14], [39, 8, 17, 45, 30]];
          const P = [
            { x: 140, col: "var(--train)", name: "학습 문제", desc: "정답과 함께 보여 준 문제", seqs: SEQ.slice(0, 3) },
            { x: 840, col: "var(--test)", name: "평가 문제", desc: "한 번도 보여 주지 않은 문제", seqs: SEQ.slice(3) },
          ];
          const W = 620, y0 = 280, cw = 50;
          const ans = [];
          for (const p of P) {
            el("rect", { x: p.x, y: y0, width: W, height: 420, rx: 18, fill: "#f6f6f6" });
            el("text", { x: p.x + 32, y: y0 + 54, "font-size": 34, "font-weight": 700, fill: p.col }, null, p.name);
            el("text", { x: p.x + 32, y: y0 + 92, "font-size": 22, fill: "var(--muted)" }, null, p.desc);
            p.seqs.forEach((s, k) => {
              const y = y0 + 152 + k * 56, o = rule(s);
              s.forEach((v, i) => el("text", { x: p.x + 50 + i * cw, y, "text-anchor": "middle", "font-size": 26 }, null, v));
              el("text", { x: p.x + 50 + 5 * cw, y, "text-anchor": "middle", "font-size": 26, fill: "var(--muted)" }, null, "→");
              o.forEach((v, i) => {
                const t = el("text", { x: p.x + 50 + (6 + i) * cw + 10, y, "text-anchor": "middle", "font-size": 26, "font-weight": 700, fill: p.col }, null, p === P[0] ? v : "?");
                if (p !== P[0]) ans.push([t, v]);
              });
            });
          }
          await say("문제를 둘로 나눴습니다. 한쪽은 학습에만, 다른 쪽은 평가에만 씁니다");
          const verdict = (p, a, b) => {
            el("text", { x: p.x + 32, y: y0 + 352, "font-size": 26, fill: "var(--ink)" }, null, a);
            el("text", { x: p.x + 32, y: y0 + 392, "font-size": 28, "font-weight": 700, fill: p.col }, null, b);
          };
          verdict(P[0], "학습 문제만 맞히면", "답을 외운 것 (암기)");
          await say("학습 문제만 맞힌다면 답을 외웠을 뿐입니다. 이것을 암기라고 합니다");
          for (const [t, v] of ans) t.textContent = v;
          verdict(P[1], "평가 문제까지 맞히면", "규칙을 알아낸 것 (일반화)");
          await say("처음 보는 문제까지 맞힌다면 규칙을 알아낸 것입니다. 이것을 일반화라고 합니다");
          await sleep(1500);
        }

        async function sCurve(N, idx) {
          const rs = runsOf(N), r = rs[idx], ST = stepsOf(r);
          const g = rs.filter((x) => x.tg != null).length;
          const kick = `학습 문제 ${fmt(+N)}개`;
          await head(kick, `문제 ${fmt(+N)}개로 학습시킨 기록`, "");
          const box = { x: 170, y: 290, w: 1310, h: 360 };
          const { lx, ly } = axes(box, [100, 60000], [[100, "100"], [1000, "1천"], [10000, "1만"], [60000, "6만"]],
            (v) => v + "%", false, [0, 100], [0, 50, 100]);
          axTitle(box, "학습 단계 (step)", "정답률", LOGNOTE);
          legend([["var(--train)", "학습 문제 정답률"], ["var(--test)", "처음 보는 문제 정답률"]], box.x, box.y - 66);
          const zone = el("rect", { x: lx(r.tf), y: box.y, width: 0, height: box.h, fill: "rgba(42,120,214,0.08)" });
          // 시험 문제 곡선이 위에 오게 (둘 다 100%일 때 가려지지 않도록)
          const pTr = el("path", lineStyle("var(--train)"));
          const pTe = el("path", lineStyle("var(--test)"));
          const draw = (t) => {
            pTe.setAttribute("d", curve(ST, r.te, t, lx, ly));
            pTr.setAttribute("d", curve(ST, r.tr, t, lx, ly));
            if (t > r.tf) zone.setAttribute("width", Math.max(0, lx(Math.min(t, r.tg)) - lx(r.tf)));
          };
          const run = (a, b, ms) => tween(ms, (u) => draw(u === 1 ? b : Math.exp(Math.log(a) + u * (Math.log(b) - Math.log(a)))));
          await say("주황 선은 학습 문제, 파란 선은 처음 보는 문제의 정답률입니다");
          await run(100, r.tf, 2400);
          vmark(lx(r.tf), box.y, box.y + box.h, "암기");
          const teAtF = r.te[ST.indexOf(r.tf)] ?? 0;
          await say(`${fmt(r.tf)} step에서 학습 문제는 100%, 처음 보는 문제는 ${Math.round(teAtF)}%. 답만 외운 상태입니다`);
          say("학습을 계속해도 한동안 변화가 없습니다", false);
          await run(r.tf, r.tg * 0.85, 7000);
          await say("중간에 주황 선이 떨어지는 것은 학습 중에 생기는 일시적인 흔들림입니다");
          await run(r.tg * 0.85, r.last, 2400);
          vmark(lx(r.tg), box.y, box.y + box.h, "일반화");
          el("text", { x: lx(r.last) + 14, y: ly(100) + 40, "font-size": 20, fill: "var(--muted)" }, null, "학습 종료");
          await say(`${fmt(r.tg)} step 무렵, 처음 보는 문제의 정답률이 갑자기 100%로 오릅니다`);
          const cx = (lx(r.tf) + lx(r.tg)) / 2;
          el("text", { x: cx, y: box.y + box.h * 0.6, "text-anchor": "middle", "font-size": 24, fill: "var(--muted)" }, null, "지연");
          el("text", { x: cx, y: box.y + box.h * 0.6 + 40, "text-anchor": "middle", "font-size": 34, "font-weight": 700, fill: "var(--ink)" }, null, `약 ${fmt(r.tg - r.tf)} step`);
          await head(kick, `외운 뒤 <span style="color:var(--test)">한참 지나서</span> 규칙을 알아냈습니다`, "");
          await say("암기와 일반화 사이의 이 간격을 지연이라고 부릅니다");
          await say(`같은 조건으로 ${rs.length}번 학습시켰을 때 일반화한 것은 ${g}번이었습니다`);
        }

          await tween(9000, (u) => {
            const t = u === 1 ? 60000 : Math.exp(Math.log(100) + u * (Math.log(60000) - Math.log(100)));
            for (const p of panels)
              p.rs.forEach((r, j) => {
                const ST = stepsOf(r);
                p.tr[j].setAttribute("d", curve(ST, r.tr, t, p.lx, p.ly, 60000));
                p.te[j].setAttribute("d", curve(ST, r.te, t, p.lx, p.ly, 60000));
                if (r.tg != null && !p.hit[j] && t >= r.tg) {
                  p.hit[j] = true;
                  el("circle", { cx: p.lx(r.tg), cy: p.ly(95), r: 7, fill: "var(--test)", stroke: "var(--bg)", "stroke-width": 2 });
                }
              });
          });
          const res = panels.map((p) => {
            const g = p.rs.filter((r) => r.tg != null).length, K = p.rs.length;
            el("text", { x: p.box.x, y: p.box.y + p.box.h + 84, "font-size": 28, "font-weight": 700,
              fill: g === 0 ? "var(--muted)" : g === K ? "var(--test)" : "var(--ink)" }, null, `${K}번 중 ${g}번 일반화`);
            return { N: +p.N, g, K };

          await head(kick, "문제가 많을수록 더 자주, 빨리 일반화합니다", "");
          const lo = res[0], hi = res[res.length - 1];
          await say(`${fmt(lo.N)}개는 ${lo.K}번 중 ${lo.g}번, ${fmt(hi.N)}개는 ${hi.K}번 중 ${hi.g}번 일반화했습니다`);
          await say('문제가 많을수록 <span style="color:var(--test)">●</span>가 왼쪽에 찍힙니다. 그만큼 빨리 일반화했다는 뜻입니다');
        }

        async function sBoundary() {
          const c = B.conds["add|50|1"];
          const kick = "학습 문제 수 바꾸기";
          await head(kick, "몇 개부터 일반화할까요?", "");
          // 가까운 문제 수(5% 이내)는 한 점으로 합친다
          const pts = [];
          for (const N of Object.keys(c.N).map(Number).sort((a, b) => a - b)) {
            const rs = c.N[N], g = rs.filter((x) => x.tg != null).length;
            const p = pts[pts.length - 1];
            if (p && N / p.N0 < 1.05) { p.g += g; p.k += rs.length; p.N1 = N; }
            else pts.push({ N0: N, N1: N, g, k: rs.length });
          }
          const box = { x: 190, y: 290, w: 1290, h: 360 };
          const { lx, ly } = axes(box, [220, 4600], [[300, "300"], [500, "500"], [1000, "1,000"], [2000, "2,000"], [4000, "4,000개"]],
            (v) => v + "%", false, [0, 100], [0, 50, 100]);
          axTitle(box, "학습 문제 수", "일반화한 비율", SCALENOTE);
          await say("점 하나가 문제 수 하나입니다. 위에 있을수록 일반화한 비율이 높습니다");
          const line = el("path", { fill: "none", stroke: "var(--test)", "stroke-width": 4, opacity: 0.6 });
          let d = "";
          for (const p of pts) {
            const N = Math.sqrt(p.N0 * p.N1), x = lx(N), y = ly((100 * p.g) / p.k);
            d += (d ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
            line.setAttribute("d", d);
            el("circle", { cx: x, cy: y, r: 13, fill: p.g ? "var(--test)" : "var(--bg)", stroke: "var(--test)", "stroke-width": 4 });
            const mid = p.g > 0 && p.g < p.k;
            el("text", mid
              ? { x: x + 24, y: y + 7, "font-size": 20, fill: "var(--muted)" }
              : { x, y: y + (p.g ? 46 : -26), "text-anchor": "middle", "font-size": 20, fill: "var(--muted)" }, null, `${p.g}/${p.k}`);
            await sleep(380 * DRAW);
          }
          say("점 옆 숫자는 일반화한 횟수 / 학습시킨 횟수입니다", false);
          await sleep(3500);
          vmark(lx(c.b), box.y, box.y + box.h);
          el("text", { x: lx(c.b) - 18, y: box.y + box.h * 0.42, "text-anchor": "end", "font-size": 30, "font-weight": 700, fill: "var(--ink)" }, null, `경계 약 ${fmt(c.b)}개`);
          await head(kick, `경계는 약 ${fmt(c.b)}개입니다`, "");
          await say("경계보다 적으면 외우기만 하고, 조금만 넘어도 대부분 일반화합니다");
        }

          await sleep(5000);
        }

        const QR = "11111110001111100010001111111,10000010111111000000101000001,10111010101110010011001011101,10111010011101010100101011101,10111010010011011111001011101,10000010001010100001101000001,11111110101010101010101111111,00000000011101010101000000000,01110110000111111000100000110,01011100001100001011111111001,00000110110111001110101000010,10001101111100110001000100001,01001011000000001100010100111,10011000110000100001001101111,01011111010111111111010111011,00011000101011110110010011011,00110111010100011110000111011,01101101011011101000100100000,10101011011010011000101101000,00111101000111000110111101111,01111010100101000111111110100,00000000100111101001100011011,11111110000011001101101010100,10000010110100101010100010000,10111010010011110010111111110,10111010111101001111000010110,10111010110101011100100101101,10000010110011101010101011010,11111110001111111011101100010".split(",");
        // 모서리에 항상 떠 있는 QR
        (() => {
          const n = QR.length, q = 3, N = n + 2 * q;
          let d = "";
          QR.forEach((row, i) => [...row].forEach((b, j) => {
            if (b === "1") d += `M${j + q},${i + q}h1v1h-1z`;
          }));
          $("#qr").innerHTML = `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges"><rect width="${N}" height="${N}" fill="#fff"/><path d="${d}" fill="#000"/></svg><b>직접 해 보기</b><span>posterqr.vercel.app</span>`;
        })();

        /* ---------- 순서 ---------- */
        const SCENES = [sTitle, sRule, sSetup, () => sCurve("665", 1), sMulti, sBoundary, sTable, sLaw, sNoise, sEnd];
        $("#dots").innerHTML = SCENES.map(() => "<i></i>").join("");
        async function loop() {
          let i0 = +Q.get("s") || 0;
          for (;;)
            for (let i = i0; i < SCENES.length; i++, i0 = 0) {
              document.querySelectorAll("#dots i").forEach((e, j) => e.classList.toggle("on", j === i));
              try {
                await SCENES[i]();
              } catch (e) {
                console.error(e);
                await sleep(1000);
              }
              if (Q.get("stop")) return;
              await clear();
            }
        }

        /* ---------- 화면 꺼짐 방지 · 나가기 ---------- */
        async function wake() {
          try {
            if (navigator.wakeLock) await navigator.wakeLock.request("screen");
          } catch (e) {}
        }
        document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wake());
        wake();
        addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          if (window.parent !== window) window.parent.postMessage("loop-exit", "*");
          else location.href = "../";
        });
        // 단독으로 열었을 때: 클릭하면 전체 화면
        if (window.parent === window)
          addEventListener("click", () => document.fullscreenElement || document.documentElement.requestFullscreen?.().catch(() => {}));

        Promise.all([fetch("../try/bound.json").then((r) => r.json()), fetch("../try/noise.json").then((r) => r.json())])
          .then(([b, n]) => {
            B = b;
            Nz = n;
            loop();
          })
          .catch(() => head("", "기록을 불러오지 못했습니다", "인터넷 연결을 확인하고 새로 고쳐 주세요."));
      })();
    </script>
  </body>
</html>
